<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Sistema de Vendas</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}.wrap{max-width:700px;margin:auto;padding:14px}.top{background:#111;color:white;border-radius:16px;padding:18px;margin-bottom:12px}.top h1{margin:0 0 5px;font-size:22px}.top p{margin:0;color:#ddd;font-size:13px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.menu button{padding:14px 5px;border:1px solid #ddd;background:white;border-radius:12px;font-weight:bold}.menu button.on{background:#111;color:#fff}.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:15px;margin-bottom:12px}.btn{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 15px;font-weight:bold}.btn.gray{background:#eee;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prod{border:1px solid #ddd;border-radius:14px;overflow:hidden}.photo{height:150px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:45px}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:11px}.muted{font-size:12px;color:#777}.price{font-size:18px;font-weight:bold;margin:6px 0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:7px 0}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#666;margin-bottom:4px}.field input,.field select{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}.hidden{display:none}.empty{text-align:center;color:#777;padding:25px}.item{border-bottom:1px solid #eee;padding:10px 0}.total{display:flex;justify-content:space-between;font-weight:bold;font-size:19px;margin-top:12px}.badge{display:inline-block;background:#eee;border-radius:20px;padding:5px 9px;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px}.box{background:#fff;border-radius:16px;padding:17px;width:min(500px,100%);max-height:90vh;overflow:auto}.success{background:#e9f8ed;padding:12px;border-radius:10px;margin-top:10px}
</style></head><body><div class="wrap">
<div class="top"><h1>Meu Sistema de Vendas</h1><p>Versão de teste — catálogo e pedidos</p></div>
<div class="menu"><button data-p="home">🏠 Início</button><button data-p="catalog">🛍️ Catálogo</button><button data-p="orders">📋 Pedidos</button><button data-p="clients">👥 Clientes</button><button data-p="sales">💰 Vendas</button><button data-p="routes">🗺️ Rotas</button></div>
<section id="home" class="page"><div class="card"><h2>Teste rápido</h2><p>Cadastre um produto, adicione ao carrinho e finalize um pedido. Tudo fica salvo neste navegador.</p><button class="btn" id="goCat">Abrir catálogo</button></div></section>
<section id="catalog" class="page hidden"><div class="card"><div class="row"><h2>Catálogo</h2><button class="btn" id="add">+ Produto</button></div><div id="products" class="grid"></div></div><div class="card"><h2>🛒 Pedido</h2><div id="cart"></div></div></section>
<section id="orders" class="page hidden"><div class="card"><h2>📋 Pedidos recebidos</h2><div id="ordersList"></div></div></section>
<section id="clients" class="page hidden"><div class="card"><div class="row"><h2>👥 Clientes</h2><button class="btn" id="addClient">+ Cliente</button></div><div id="clientsList"></div></div></section>
<section id="sales" class="page hidden"><div class="card"><h2>💰 Controle de vendas</h2><div id="salesList"></div></div></section>
<section id="routes" class="page hidden"><div class="card"><div class="row"><h2>🗺️ Rotas</h2><button class="btn" id="addRoute">+ Rota</button></div><div id="routesList"></div></div></section>
</div><div id="modal" class="modal hidden"><div class="box" id="box"></div></div>
<script>
const K="svteste2";let S=JSON.parse(localStorage.getItem(K)||"null")||{products:[],cart:[],orders:[],clients:[],routes:[]};
const save=()=>{localStorage.setItem(K,JSON.stringify(S));render()};const br=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(n||0);
function show(p){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("hidden",x.id!==p));document.querySelectorAll(".menu button").forEach(x=>x.classList.toggle("on",x.dataset.p===p));render()}
document.querySelectorAll(".menu button").forEach(b=>b.onclick=()=>show(b.dataset.p));document.getElementById("goCat").onclick=()=>show("catalog");
function modal(s){box.innerHTML=s;modalEl.classList.remove("hidden")}const modalEl=document.getElementById("modal");function close(){modalEl.classList.add("hidden")}modalEl.onclick=e=>{if(e.target===modalEl)close()};
function addProduct(){modal(`<h2>Novo produto</h2><div class="field"><label>Nome</label><input id="n" placeholder="Ex.: Jogo de cama"></div><div class="field"><label>Preço</label><input id="pr" type="number" step="0.01" placeholder="149.90"></div><div class="field"><label>Código</label><input id="c" placeholder="001"></div><div class="field"><label>Foto</label><input id="im" type="file" accept="image/*"></div><button class="btn gray" id="cancel">Cancelar</button> <button class="btn" id="savep">Salvar produto</button>`);cancel.onclick=close;savep.onclick=()=>{let n=document.getElementById("n").value.trim(),pr=Number(document.getElementById("pr").value);if(!n||pr<=0){alert("Informe nome e preço.");return}let f=document.getElementById("im").files[0];let done=src=>{S.products.push({id:Date.now()+"",name:n,price:pr,code:c.value,image:src||""});close();save();show("catalog")};if(f){let r=new FileReader;r.onload=()=>done(r.result);r.readAsDataURL(f)}else done("")}}
add.onclick=addProduct;
function renderProducts(){let d=document.getElementById("products");d.innerHTML=S.products.length?S.products.map(p=>`<div class="prod"><div class="photo">${p.image?`<img src="${p.image}">`:"📦"}</div><div class="info"><div class="muted">Código ${p.code||"-"}</div><b>${p.name}</b><div class="price">${br(p.price)}</div><button class="btn" data-add="${p.id}">Adicionar ao pedido</button></div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">Nenhum produto.<br><br>Toque em <b>+ Produto</b> para cadastrar o primeiro.</div>`;d.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{let x=S.cart.find(i=>i.id===b.dataset.add);x?x.q++:S.cart.push({id:b.dataset.add,q:1});renderCart()})}
function renderCart(){let d=document.getElementById("cart");if(!S.cart.length){d.innerHTML="<div class='empty'>O carrinho está vazio.</div>";return}let total=0;d.innerHTML=S.cart.map(i=>{let p=S.products.find(x=>x.id===i.id),t=p.price*i.q;total+=t;return `<div class="item"><div class="row"><b>${p.name}</b><span>${br(t)}</span></div><div class="row"><span>Quantidade: ${i.q}</span><span><button class="btn gray" data-dec="${p.id}">−</button> <button class="btn gray" data-inc="${p.id}">+</button></span></div></div>`}).join("")+`<div class="total"><span>Total</span><span>${br(total)}</span></div><br><button class="btn" style="width:100%" id="finish">Finalizar pedido</button>`;d.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{S.cart.find(i=>i.id===b.dataset.inc).q++;renderCart()});d.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{let i=S.cart.find(i=>i.id===b.dataset.dec);i.q--;if(i.q<1)S.cart=S.cart.filter(x=>x!==i);renderCart()});finish.onclick=checkout}
function checkout(){modal(`<h2>Finalizar pedido</h2><div class="field"><label>Nome do cliente</label><input id="cn" placeholder="Nome"></div><div class="field"><label>Cidade / rota</label><input id="cr" placeholder="Curvelo"></div><div class="field"><label>Pagamento</label><select id="cp"><option>60 dias</option><option>À vista</option><option>Pix</option><option>Cartão</option></select></div><button class="btn gray" id="cancel">Cancelar</button> <button class="btn" id="ok">Enviar pedido</button>`);cancel.onclick=close;ok.onclick=()=>{let name=cn.value.trim(),route=cr.value.trim();if(!name||!route){alert("Preencha nome e cidade.");return}let items=S.cart.map(i=>{let p=S.products.find(x=>x.id===i.id);return{name:p.name,price:p.price,q:i.q}}),total=items.reduce((a,i)=>a+i.price*i.q,0);S.orders.unshift({id:Date.now(),name,route,payment:cp.value,items,total,status:"Novo"});S.cart=[];if(!S.clients.some(c=>c.name.toLowerCase()===name.toLowerCase()))S.clients.push({name,city:route});close();save();show("orders")}}
function renderOrders(){let d=document.getElementById("ordersList");d.innerHTML=S.orders.length?S.orders.map(o=>`<div class="card"><div class="row"><div><b>${o.name}</b><div class="muted">${o.route} • ${o.payment}</div></div><b>${br(o.total)}</b></div><p>${o.items.map(i=>i.q+"× "+i.name).join(" • ")}</p><span class="badge">${o.status}</span> <select data-st="${o.id}" style="padding:7px;border-radius:8px"><option>Novo</option><option>Confirmado</option><option>Entregue</option><option>Pago</option></select></div>`).join(""):"<div class='empty'>Nenhum pedido recebido ainda.</div>";d.querySelectorAll("[data-st]").forEach(s=>{let o=S.orders.find(x=>x.id==s.dataset.st);s.value=o.status;s.onchange=()=>{o.status=s.value;save()}})}
function renderClients(){let d=document.getElementById("clientsList");d.innerHTML=S.clients.length?S.clients.map(c=>`<div class="item"><b>${c.name}</b><div class="muted">${c.city||""} ${c.phone?"• "+c.phone:""}</div></div>`).join(""):"<div class='empty'>Nenhum cliente.</div>"}
function clientForm(){modal(`<h2>Novo cliente</h2><div class="field"><label>Nome</label><input id="x"></div><div class="field"><label>Telefone</label><input id="t" inputmode="tel"></div><div class="field"><label>Cidade</label><input id="y"></div><button class="btn gray" id="cancel">Cancelar</button> <button class="btn" id="ok">Salvar</button>`);cancel.onclick=close;ok.onclick=()=>{if(!x.value.trim()){alert("Informe o nome.");return}S.clients.push({name:x.value.trim(),phone:t.value,city:y.value});close();save()}}
function routeForm(){modal(`<h2>Nova rota</h2><div class="field"><label>Nome</label><input id="r"></div><div class="field"><label>Data</label><input id="d" type="date"></div><button class="btn gray" id="cancel">Cancelar</button> <button class="btn" id="ok">Salvar</button>`);cancel.onclick=close;ok.onclick=()=>{if(!r.value.trim()){alert("Informe a rota.");return}S.routes.push({name:r.value.trim(),date:d.value});close();save()}}
function renderRoutes(){let d=document.getElementById("routesList");d.innerHTML=S.routes.length?S.routes.map(r=>`<div class="item"><b>${r.name}</b><div class="muted">${r.date||"Sem data"}</div></div>`).join(""):"<div class='empty'>Nenhuma rota.</div>"}
function renderSales(){let d=document.getElementById("salesList"),paid=S.orders.filter(o=>o.status==="Pago").reduce((a,o)=>a+o.total,0),rec=S.orders.filter(o=>o.status!=="Pago").reduce((a,o)=>a+o.total,0);d.innerHTML=`<div class="grid"><div class="card"><span class="muted">Vendido</span><h2>${br(S.orders.reduce((a,o)=>a+o.total,0))}</h2></div><div class="card"><span class="muted">A receber</span><h2>${br(rec)}</h2></div></div><div class="success">Pago: ${br(paid)}</div>`}
function render(){renderProducts();renderCart();renderOrders();renderClients();renderRoutes();renderSales()}
render();show("home");
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script></body></html>
